name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  node-test:
    name: node --test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Print versions
        run: |
          node --version
          npm --version

      - name: Run the full test suite
        run: npm test
